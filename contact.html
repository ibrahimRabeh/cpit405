<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ibrahim Aljohani | Contact</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="bg-gray-900 text-white transition-colors duration-300">
    <nav
      class="fixed w-full z-50 backdrop-blur-lg bg-gray-900/90 border-b border-gray-800 transition-colors"
    >
      <div class="max-w-7xl mx-auto px-4 lg-px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <a href="index.html" class="text-xl font-bold text-white nav-logo"
              >Ibrahim Aljohani</a
            >
          </div>
          <div class="flex items-center space-x-6">
            <a href="contact.html" class="p-2 transition-colors nav-icon">✉️</a>
            <a
              href="https://github.com/ibrahimRabeh"
              target="_blank"
              rel="noopener noreferrer"
              class="p-2 transition-colors nav-icon"
              >🐙</a
            >
            <a
              href="https://linkedin.com/in/ibrahim-aljohany"
              target="_blank"
              rel="noopener noreferrer"
              class="p-2 transition-colors nav-icon"
              >💼</a
            >
          </div>
        </div>
      </div>
    </nav>

    <main
      class="pt-32 pb-20 px-4 lg-px-8 max-w-7xl mx-auto"
      style="min-height: 85vh"
    >
      <div
        style="
          display: flex;
          justify-content: center;
          gap: 2rem;
          margin-bottom: 3rem;
          flex-wrap: wrap;
        "
      >
        <a
          href="index.html"
          class="text-xl theme-li"
          style="text-decoration: none; font-weight: 500"
          >Home</a
        >
        <a
          href="cv.html"
          class="text-xl theme-li"
          style="text-decoration: none; font-weight: 500"
          >CV</a
        >
        <a
          href="projects.html"
          class="text-xl theme-li"
          style="text-decoration: none; font-weight: 500"
          >Projects</a
        >
        <a
          href="labs.html"
          class="text-xl theme-li"
          style="text-decoration: none; font-weight: 500"
          >University Labs</a
        >
        <a
          href="contact.html"
          class="text-xl theme-li"
          style="
            color: #60a5fa;
            text-decoration: none;
            border-bottom: 2px solid #60a5fa;
            font-weight: bold;
          "
          >Contact</a
        >
      </div>

      <!-- Connect Block -->
      <section>
        <h2
          class="text-4xl lg-text-5xl font-bold text-center mb-12 section-title"
        >
          Get In Touch
        </h2>

        <div class="grid lg-grid-cols-2 gap-8 items-start">
          <!-- Info -->
          <div class="theme-expertise-card grid" style="margin-right: 10px">
            <h3
              style="
                font-size: 1.25rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                color: #60a5fa;
              "
            >
              Contact Information
            </h3>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 2rem;
              "
            >
              <a
                href="mailto:Ibrahim.rabehh@gmail.com"
                class="theme-li"
                style="
                  display: flex;
                  align-items: center;
                  gap: 1rem;
                  text-decoration: none;
                "
              >
                📧 <span>Ibrahim.rabehh@gmail.com</span>
              </a>
              <a
                href="https://linkedin.com/in/ibrahim-aljohany"
                target="_blank"
                class="theme-li"
                style="
                  display: flex;
                  align-items: center;
                  gap: 1rem;
                  text-decoration: none;
                "
              >
                💼 <span>ibrahim-aljohany</span>
              </a>
              <a
                href="https://github.com/ibrahimRabeh"
                target="_blank"
                class="theme-li"
                style="
                  display: flex;
                  align-items: center;
                  gap: 1rem;
                  text-decoration: none;
                "
              >
                💻 <span>ibrahimRabeh</span>
              </a>
            </div>

            <div
              style="
                padding: 1rem;
                background-color: var(--bg-light);
                border: 1px solid #374151;
                border-radius: 0.5rem;
              "
            >
              <p
                class="theme-subtitle"
                style="
                  font-weight: 500;
                  display: flex;
                  align-items: center;
                  gap: 0.75rem;
                "
              >
                💡
                <span style="color: #60a5fa">Quick Response Time:</span> Usually
                within 24 hours
              </p>
            </div>
          </div>

          <!-- Form -->
          <div class="theme-expertise-card">
            <h3
              style="
                font-size: 1.25rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                color: #60a5fa;
              "
            >
              Send a Message
            </h3>
            <form
              action="https://formsubmit.co/Ibrahim.rabehh@gmail.com"
              method="POST"
              style="display: flex; flex-direction: column; gap: 1rem"
            >
              <input
                type="hidden"
                name="_subject"
                value="New submission from Portfolio"
              />
              <input
                type="text"
                name="name"
                required
                placeholder="Full Name"
                style="
                  padding: 0.75rem;
                  border-radius: 0.5rem;
                  background: var(--bg-light);
                  color: white;
                  border: 1px solid #374151;
                "
              />
              <input
                type="email"
                name="email"
                required
                placeholder="Email Address"
                style="
                  padding: 0.75rem;
                  border-radius: 0.5rem;
                  background: var(--bg-light);
                  color: white;
                  border: 1px solid #374151;
                "
              />
              <textarea
                name="message"
                rows="5"
                required
                placeholder="Your Message"
                style="
                  padding: 0.75rem;
                  border-radius: 0.5rem;
                  background: var(--bg-light);
                  color: white;
                  border: 1px solid #374151;
                "
              ></textarea>
              <button
                type="submit"
                class="btn-primary"
                style="width: 100%; border: none; cursor: pointer"
              >
                Send Message
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="theme-footer py-8 px-4 text-center">
      <p style="color: var(--text-dark-muted)">
        © 2026 Ibrahim.dev. All rights reserved.
      </p>
    </footer>
  </body>
</html>
