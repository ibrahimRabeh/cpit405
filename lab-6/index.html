<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - JavaScript & Cookies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CPIT405 Universal Navigation Header inserted for consistency -->
  <header style="background: rgba(17, 24, 39, 0.9); padding: 1rem; border-bottom: 1px solid #1f2937; position: fixed; width: 100%; top: 0; left: 0; z-index: 100; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div style="max-width: 80rem; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <a href="../index.html" style="text-decoration: none; font-weight: bold; background: linear-gradient(to right, #60a5fa, #818cf8); -webkit-background-clip: text; color: transparent;">Ibrahim Aljohani</a>
      <div>
        <a href="../labs.html" style="background: linear-gradient(to right, #4f46e5, #7c3aed); color: white; padding: 0.5rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: 500; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-right: 1.5rem;">← Back to All Labs</a>
      </div>
    </div>
  </header>

  <!-- Wrapping Lab content with padding to prevent collision with fixed header -->
  <div style="padding-top: 5rem;">
    <h1 class="lab-title">Lab 6</h1>
    <h2 class="section-title">Like or dislike</h2>

    <div class="vote-container">
        <button id="like-btn" class="vote-btn">
            <span>👍</span>
            <span id="like-count" class="count">0</span>
        </button>
        <button id="dislike-btn" class="vote-btn">
            <span>👎</span>
            <span id="dislike-count" class="count">0</span>
        </button>
    </div>

    <div class="comments-section">
        <h2>Comments</h2>
        <textarea id="comment-input" placeholder="Write a comment..."></textarea>
        
        <div class="action-buttons">
            <button id="submit-btn" class="btn">Submit</button>
            <button id="clear-btn" class="btn">Clear</button>
        </div>

        <div id="comment-list" class="comment-list">
            <!-- Comments will be injected here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
