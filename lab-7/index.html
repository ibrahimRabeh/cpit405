<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 | Unsplash Image Search | Ibrahim Aljohani</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark transition-colors duration-300">
    
    <!-- Navigation Bar (Consistent with Portfolio) -->
    <nav class="fixed w-full z-50 backdrop-blur-lg border-b transition-colors bg-gray-900/90 border-gray-800">
        <div class="max-w-7xl mx-auto px-4 lg-px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="../index.html" class="text-xl font-bold nav-logo">Ibrahim Aljohani</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="../labs.html" class="nav-icon" title="Back to Labs">Labs</a>
                    <a href="../index.html" class="nav-icon">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-4 lg-px-8 max-w-7xl mx-auto">
        <section class="hero-section text-center mb-16">
            <h1 class="text-5xl font-bold mb-4 section-title">Lab 7: Unsplash Image Explorer</h1>
            <p class="text-xl theme-subtitle">Discover stunning photography using XHR, Fetch Promises, and Async/Await.</p>
        </section>

        <!-- Control Panel -->
        <section class="control-panel mb-12">
            <div class="search-container glass-effect">
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="Search for images (e.g., 'Nature', 'Tech')..." autocomplete="off">
                    <button id="searchBtn" class="btn-primary">
                        <span class="btn-text">Search</span>
                        <span class="btn-icon">🔍</span>
                    </button>
                </div>
                
                <div class="options-group">
                    <label class="method-label">Fetch Method:</label>
                    <div class="radio-group">
                        <label class="radio-btn">
                            <input type="radio" name="fetchMethod" value="xhr" checked>
                            <span class="radio-custom"></span>
                            XHR
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="fetchMethod" value="promises">
                            <span class="radio-custom"></span>
                            Promises
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="fetchMethod" value="async">
                            <span class="radio-custom"></span>
                            Async/Await
                        </label>
                    </div>
                    <button id="clearBtn" class="btn-secondary">Clear</button>
                </div>
            </div>
        </section>

        <!-- Status Message -->
        <div id="statusMessage" class="status-hidden">
            <div class="loader-spinner"></div>
            <p id="statusText">Searching for images...</p>
        </div>

        <!-- Results Gallery -->
        <section class="gallery-section">
            <div id="imageGrid" class="image-grid">
                <!-- Dynamically filled by JS -->
                <div class="empty-state">
                    <p>Enter a keyword to start exploring.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="theme-footer py-8 px-4 text-center">
        <p style="color: var(--text-dark-muted);">© 2026 Ibrahim.dev | CPIT405 Lab 7</p>
    </footer>

</body>
</html>
